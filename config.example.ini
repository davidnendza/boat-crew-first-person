# BoatCrewMod settings. The mod writes this file as BoatCrewMod/config.ini in the game folder on first run;
# this copy only documents the keys. Edit the one in the game folder and restart the game.

# hotkey: toggles first person for the selected crewmate. Insert, F9, Home, End, PageUp, PageDown, Pause,
# ScrollLock, NumpadMultiply, or 0x75 (a Windows virtual-key code in hex). Avoid F8: it opens the game's debug console.
hotkey=Insert

# sensitivity: degrees of turn per mouse count (raw input). Lower is slower.
sensitivity=0.12

# runkey: hold to run while walking with WASD. Shift is the game's magnify, so the default is Ctrl.
runkey=Ctrl

# walkspeed / runspeed: metres per second while holding WASD (and the run key).
walkspeed=1.5
runspeed=3.0

# eyeforward: how far ahead of the head bone the camera sits, in metres, so the face is not in view.
eyeforward=0.18

# camera: head (the head bone, default) or bounds (the top of the visible body mesh).
camera=head
